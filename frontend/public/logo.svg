<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ERP Trading">
  <!--
    The application mark. Replace this one file to use your own logo — nothing
    in the code refers to its contents, only its path.

    Three ascending bars: legible as growth at 24px in the collapsed rail,
    where anything finer would turn to mush.
  -->
  <defs>
    <linearGradient id="erpMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#erpMark)"/>

  <rect x="15" y="34" width="8" height="15" rx="3" fill="#ffffff" opacity="0.55"/>
  <rect x="28" y="25" width="8" height="24" rx="3" fill="#ffffff" opacity="0.78"/>
  <rect x="41" y="15" width="8" height="34" rx="3" fill="#ffffff"/>
</svg>
